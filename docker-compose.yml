services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: skillhydra
      POSTGRES_PASSWORD: skillhydra
      POSTGRES_DB: skillhydra
    ports:
      - "5432:5432"
    volumes:
      - skillhydra_pg:/var/lib/postgresql/data

  web:
    build: .
    environment:
      DATABASE_URL: postgresql://skillhydra:skillhydra@postgres:5432/skillhydra
      SANDBOX_PROVIDER: mock
    ports:
      - "3000:3000"
    depends_on:
      - postgres

volumes:
  skillhydra_pg:
